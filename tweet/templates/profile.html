{% extends "layout.html" %}

{% block content %}
<h2>{{ user.username }}'s Profile</h2>
<p>Email: {{ user.email }}</p>

<hr>

<h3>Your Tweets</h3>

{% for tweet in tweets %}
    <div class="card p-3 mb-2">
        <p>{{ tweet.text }}</p>
    </div>
{% empty %}
    <p>No tweets yet.</p>
{% endfor %}
{% endblock %}
